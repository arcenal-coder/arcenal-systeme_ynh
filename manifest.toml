#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json
packaging_format = 2
id = "arcenal-systeme"
name = "ARCenal Système"
description.fr = "Catalogue contrôlé et espace personnel ARCenal, sans modifier le cœur YunoHost."
description.en = "Controlled catalog and ARCenal personal space without changing YunoHost core."
version = "0.6.9~ynh1"
maintainers = ["ARCenal"]

[upstream]
license = "GPL-3.0-or-later"
code = "https://github.com/arcenal-coder/arcenal-systeme_ynh"

[integration]
yunohost = ">= 12.1"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = false
sso = true
disk = "2M"
ram.build = "10M"
ram.runtime = "10M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/espace-perso"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    main.show_tile = false
