#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json
packaging_format = 2
id = "arcenal-systeme"
name = "ARCenal Système"
description.fr = "Catalogue contrôlé et espace personnel ARCenal, sans modifier le cœur YunoHost."
description.en = "Controlled catalog and ARCenal personal space without changing YunoHost core."
version = "0.5.0~ynh1"
maintainers = ["ARCenal"]

[upstream]
license = "GPL-3.0-or-later"
code = "https://github.com/arcenal-coder/arcenal-systeme_ynh"

[integration]
yunohost = ">= 12.1"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = false
sso = true
disk = "2M"
ram.build = "10M"
ram.runtime = "10M"

[install]
    [install.catalogue_url]
    ask.fr = "URL de base HTTPS du catalogue ARCenal stable"
    ask.en = "HTTPS base URL of the ARCenal stable catalog"
    type = "url"
    default = "https://raw.githubusercontent.com/arcenal-coder/arcenal-systeme-catalogue/main/stable"

[resources]
    [resources.system_user]
